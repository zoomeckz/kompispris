name: Scrape prices

# Runs on a schedule and when an admin presses "Scrape" in the app (via the trigger-scrape edge function).
# No secrets needed: upload.py proves it is this workflow with a GitHub OIDC token and the
# publish-library edge function does the writing.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "scrape_runs id created by the app (optional)"
        required: false
        default: ""
  schedule:
    - cron: "0 4 * * 1,4"   # Monday and Thursday 04:00 UTC

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # a normal run takes about an hour and a half; retries of a store that doesn't answer can add more
    timeout-minutes: 210
    defaults:
      run:
        working-directory: scraper
    env:
      SUPABASE_URL: https://mcwnxlnvoochuqldoksu.supabase.co
      RUN_ID: ${{ github.event.inputs.run_id }}
      RUN_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      KP_OUT: products.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Mark run as started
        run: python3 upload.py start
      - name: Scrape all stores
        run: python3 run_all.py
      - name: Publish library
        run: python3 upload.py publish products.json
      # also when the run is stopped or times out; the reason comes from summary.txt (written by run_all.py)
      - name: Mark run as failed
        if: failure() || cancelled()
        run: python3 upload.py fail "$(cat summary.txt 2>/dev/null || tail -n 1 run_all.log 2>/dev/null || echo 'Körningen avbröts')"
